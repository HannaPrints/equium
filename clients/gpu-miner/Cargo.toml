[package]
name = "equium-gpu-miner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU-accelerated CLI miner for Equium ($EQM). BLAKE2b leaf generation on GPU, Wagner solver on CPU."

[[bin]]
name = "equium-gpu-miner"
path = "src/main.rs"

# Build-time feature: when enabled, build.rs invokes nvcc to compile
# the CUDA kernels in cuda/*.cu into PTX and embed them in the
# binary. Lets us bypass the NVIDIA Vulkan SPIR-V crash on driver
# branches 555–575 (see clients/gpu-miner/src/cuda.rs). Off by
# default so non-CUDA builds (macOS, Windows-without-CUDA, AMD)
# stay clean. cloud-mine.sh sets it on Linux NVIDIA boxes where
# nvcc is installed.
[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
equihash-core = { path = "../../crates/equihash-core", features = ["solver"] }
equium = { path = "../../programs/equium", features = ["no-entrypoint"] }
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
solana-sdk = "2.1"
solana-client = "2.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = { workspace = true }
hex = { workspace = true }
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
num_cpus = "1"
blake2b_simd = "1"
# For re-validating GPU-emitted Wagner solutions against the upstream
# verifier before submitting tx. Same crate equihash-core uses.
equihash = { workspace = true }

# GPU: wgpu picks the best available backend (Metal on macOS, Vulkan on
# Linux/Windows, DX12 on Windows). bytemuck for safely casting structs
# to byte slices for GPU buffers. pollster for blocking on async wgpu
# calls without dragging in a full tokio runtime.
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# Optional: cudarc gives us a high-level safe wrapper around the
# CUDA Driver API. `dynamic-loading` makes libcuda an at-runtime
# dependency (dlopen) so the wgpu-only build still runs on hosts
# without CUDA installed. Only pulled in when --features cuda is
# active (see [features] above).
cudarc = { version = "0.16", default-features = false, features = ["driver", "dynamic-loading", "cuda-12040"], optional = true }

[dev-dependencies]
# naga lets us parse + validate WGSL shaders in `cargo test` without
# needing a real GPU adapter. The version is pinned to match wgpu's
# internal naga (avoids dual-version compiles).
naga = { version = "24", features = ["wgsl-in"] }
